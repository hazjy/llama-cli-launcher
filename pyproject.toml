[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "llama-launcher"
version = "0.1.0"
description = "A CLI launcher for llama.cpp with multimodal model support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "hazjy", email = "302172754+hazjy@users.noreply.github.com"}
]
keywords = ["llama", "llm", "inference", "cli", "multimodal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "gguf>=0.10.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
llama = "llama_launcher.cli:main"
llama-launch = "llama_launcher.cli:main"

[project.urls]
Homepage = "https://github.com/hazjy/llama-cli-launcher"
Repository = "https://github.com/hazjy/llama-cli-launcher"
Issues = "https://github.com/hazjy/llama-cli-launcher/issues"

[tool.setuptools.packages.find]
include = ["llama_launcher*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
